name: Build Eidolon Frontier v59 APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag for the v59 artifacts
        required: true
        default: v59

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare checked-in v59 source and backup ZIP
        shell: bash
        run: |
          set -euo pipefail

          # Eidolon-Frontier/ is now the authoritative editable source. Keep a
          # clean backup ZIP, then build from a disposable copy because the APK
          # path-rewrite step intentionally modifies its working tree.
          test -f Eidolon-Frontier/package.json
          test -f Eidolon-Frontier/package-lock.json
          test -f Eidolon-Frontier/app/page.tsx

          rm -f Eidolon-Frontier-v59-Source.zip
          zip -qr Eidolon-Frontier-v59-Source.zip Eidolon-Frontier \
            -x 'Eidolon-Frontier/node_modules/*' \
               'Eidolon-Frontier/dist/*' \
               'Eidolon-Frontier/mobile-dist/*' \
               'Eidolon-Frontier/.sites-runtime/*' \
               'Eidolon-Frontier/.vinext/*' \
               'Eidolon-Frontier/.wrangler/*'
          test -s Eidolon-Frontier-v59-Source.zip

          rm -rf source
          mkdir -p source
          cp -a Eidolon-Frontier source/Eidolon-Frontier
          test -f source/Eidolon-Frontier/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/Eidolon-Frontier/package-lock.json

      - name: Build v59 as an offline mobile web bundle
        shell: bash
        working-directory: source/Eidolon-Frontier
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

          # The normal project build targets Cloudflare/Vinext. For the APK we
          # compile the client-rendered game directly with Vite, preserving all
          # public sprites, portraits, audio, stages and VFX.
          cat > mobile-entry.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import Game from './app/page';
          import './app/globals.css';

          const root = document.getElementById('root');
          if (!root) throw new Error('Missing #root');
          createRoot(root).render(<Game />);
          TSX

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
              <meta name="theme-color" content="#080b13" />
              <title>Eidolon Frontier</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/mobile-entry.tsx"></script>
            </body>
          </html>
          HTML

          cat > mobile.vite.config.mjs <<'JS'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            base: '/assets/',
            plugins: [react()],
            publicDir: 'public',
            build: {
              outDir: 'mobile-dist',
              emptyOutDir: true,
              sourcemap: false,
            },
          });
          JS

          # In the Android WebView, game files are served from the secure
          # /assets/ URL space. Rewrite the game's root-relative media paths to
          # that URL space without changing gameplay code.
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('app/page.tsx'),
              Path('app/globals.css'),
              Path('remotion/BattleVfx.tsx'),
              Path('remotion/Root.tsx'),
          ]
          roots = ['audio', 'units', 'sprites', 'effects', 'stages', 'destinations', 'enemies', 'fonts', 'icons', 'backgrounds', 'summon', 'ui']

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for root in roots:
                  text = text.replace(f'"/{root}/', f'"/assets/{root}/')
                  text = text.replace(f"'/{root}/", f"'/assets/{root}/")
                  # Most sprite/VFX paths are built from template literals
                  # (backtick strings), not plain quotes — e.g.
                  # `/sprites/units/${id}-idle-a.webp`. Missing this left the
                  # large majority of in-game images unrewritten, so they
                  # never resolved under the WebView's /assets/ origin.
                  text = text.replace(f'`/{root}/', f'`/assets/{root}/')
              # Service workers are unnecessary inside the packaged APK and can
              # fail to install on a synthetic WebView origin.
              text = text.replace(
                  'if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => undefined);',
                  '/* APK: assets are packaged locally; no service worker required. */'
              )
              path.write_text(text, encoding='utf-8')
          PY

          npx vite build --config mobile.vite.config.mjs
          test -f mobile-dist/index.html
          test -d mobile-dist/assets

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android wrapper
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing GitHub Actions secret: ${secret_name}" >&2
              exit 1
            fi
          done

          mkdir -p app/src/main/java/com/eidolon/frontier
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp -a source/Eidolon-Frontier/mobile-dist/. app/src/main/assets/
          cp source/Eidolon-Frontier/public/icons/lyra-app-icon-v53.png app/src/main/res/drawable/eidolon_launcher.png
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > eidolon-release.jks

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'EidolonFrontier'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          PROPERTIES

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.eidolon.frontier'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.eidolon.frontier'
                  minSdk 24
                  targetSdk 35
                  versionCode 59
                  versionName '59.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../eidolon-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              androidResources {
                  noCompress += ['html', 'js', 'css', 'webp', 'png', 'jpg', 'jpeg', 'svg', 'mp3', 'mp4', 'woff2']
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/eidolon_launcher"
                  android:roundIcon="@drawable/eidolon_launcher"
                  android:label="Eidolon Frontier"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/eidolon/frontier/MainActivity.java <<'JAVA'
          package com.eidolon.frontier;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.view.WindowManager;

          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  webView.setWebChromeClient(new android.webkit.WebChromeClient());
                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }
                  });

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setAllowFileAccessFromFileURLs(false);
                  settings.setAllowUniversalAccessFromFileURLs(false);

                  setContentView(webView);
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build signed v59 release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Eidolon-Frontier-v59.apk
          sha256sum Eidolon-Frontier-v59.apk > Eidolon-Frontier-v59.apk.sha256

      - name: Upload v59 APK and editable-source backup
        uses: actions/upload-artifact@v4
        with:
          name: Eidolon-Frontier-v59-Release
          path: |
            Eidolon-Frontier-v59.apk
            Eidolon-Frontier-v59.apk.sha256
            Eidolon-Frontier-v59-Source.zip
          if-no-files-found: error
          compression-level: 0

      - name: Attach v59 APK and source backup to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Eidolon Frontier v59" \
              --notes "Signed v59 APK: fixed the normal-attack frame-cycling bug (only 2 of 4 authored frames ever showed), aligned Burst hit-counts to the new progressive Burst frame timelines, reworked Zephyra's normal-attack and Burst projectile VFX, restored the pre-v58 battle pacing, and locked the idle shadow for 5-star units to match the now motion-locked sprite."
          fi

          echo "Uploading v59 artifacts to release tag: ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" \
            Eidolon-Frontier-v59.apk \
            Eidolon-Frontier-v59.apk.sha256 \
            Eidolon-Frontier-v59-Source.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
