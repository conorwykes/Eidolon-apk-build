name: Build Signed Gates of Azura v59 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Signed v59 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify permanent Android identity
        run: |
          grep -F "applicationId 'com.eidolon.frontier'" android/app/build.gradle
          grep -F "versionCode 59" android/app/build.gradle
          grep -F "versionName '59.0'" android/app/build.gradle

      - name: Check existing signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build offline mobile web bundle
        run: npm run android:prepare

      - name: Verify Android web assets
        run: |
          test -f android/app/src/main/assets/www/index.html
          test -d android/app/src/main/assets/www/assets

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Decode permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eidolon-release.jks"

      - name: Build signed v59 release APK
        env:
          GOA_KEYSTORE: ${{ runner.temp }}/eidolon-release.jks
          GOA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease

      - name: Verify APK signature and package
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Gates-of-Azura-v59.apk
          sha256sum Gates-of-Azura-v59.apk > Gates-of-Azura-v59.apk.sha256

      - name: Upload signed installable APK
        uses: actions/upload-artifact@v5
        with:
          name: Gates-of-Azura-v59-signed-APK
          path: |
            Gates-of-Azura-v59.apk
            Gates-of-Azura-v59.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
